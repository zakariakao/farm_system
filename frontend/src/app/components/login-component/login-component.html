

  <!-- Background blobs -->
  <div class="bg">
    <span class="blob blob-green"></span>
    <span class="blob blob-sand"></span>
    <span class="blob blob-green2"></span>
    <span class="blob blob-sand2"></span>
  </div>

  <main class="wrap">
    <section class="card">
      <!-- LEFT: Form -->
      <div class="left">
        

        <p class="welcome">Welcome</p>
        <h1 class="headline" id="pageTitle">Log In</h1>

        <form id="authForm" novalidate (ngSubmit)="login()">
          <!-- REGISTER ONLY -->
          <div class="field" data-only="register">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" placeholder="Your name" autocomplete="name" />
            <small class="error" data-error-for="fullName"></small>
          </div>

          <!-- EMAIL -->
          <div class="field">
            <label for="email">Your Email</label>
            <input
             id="email"
             type="email"
             name="email"
             [(ngModel)]="credentials.email"
             placeholder="Your email"
            />

            <small class="error" data-error-for="email"></small>
          </div>

          <!-- PASSWORD -->
          <div class="field">
            <label for="password">Password</label>
            <div class="inputIcon">
              <input
               id="password"
              type="password"
              name="password"
              [(ngModel)]="credentials.password"
              placeholder="Your password"
              />

              <button class="eyeBtn" type="button" data-eye="password" aria-label="Show password">
                <!-- eye icon -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5c5.2 0 9.3 3.3 10.9 7-1.6 3.7-5.7 7-10.9 7S2.7 15.7 1.1 12C2.7 8.3 6.8 5 12 5zm0 2C7.9 7 4.6 9.4 3.2 12 4.6 14.6 7.9 17 12 17s7.4-2.4 8.8-5C19.4 9.4 16.1 7 12 7zm0 2.2A2.8 2.8 0 1 1 12 15a2.8 2.8 0 0 1 0-5.6z"/>
                </svg>
              </button>
            </div>
            <small class="error" data-error-for="password"></small>
          </div>

          <!-- REGISTER ONLY -->
          <div class="field" data-only="register">
            <label for="confirmPassword">Confirm Password</label>
            <div class="inputIcon">
              <input id="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" />
              <button class="eyeBtn" type="button" data-eye="confirmPassword" aria-label="Show confirm password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5c5.2 0 9.3 3.3 10.9 7-1.6 3.7-5.7 7-10.9 7S2.7 15.7 1.1 12C2.7 8.3 6.8 5 12 5zm0 2C7.9 7 4.6 9.4 3.2 12 4.6 14.6 7.9 17 12 17s7.4-2.4 8.8-5C19.4 9.4 16.1 7 12 7zm0 2.2A2.8 2.8 0 1 1 12 15a2.8 2.8 0 0 1 0-5.6z"/>
                </svg>
              </button>
            </div>
            <small class="error" data-error-for="confirmPassword"></small>
          </div>

          

          <button class="primaryBtn" type="submit" id="submitBtn">Log In</button>

          

          <div class="formMsg" id="formMsg" role="status" aria-live="polite"></div>
        </form>
      </div>

      <!-- RIGHT: Promo panel -->
      <div class="right">
        <div class="brand">
          <div class="brandName">Farm Feed</div>
          <div class="brandRole"></div>
        </div>

        <div class="art">
          <!-- Simple illustration (inline SVG) -->
          <svg viewBox="0 0 900 520" class="heroSvg" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="0" x2="1">
                <stop offset="0" stop-color="#18b26b"/>
                <stop offset="1" stop-color="#0aa25f"/>
              </linearGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b3b25" flood-opacity=".25"/>
              </filter>
            </defs>

            <!-- ground -->
            <path d="M120 420 C210 350, 350 340, 450 380 C560 420, 690 420, 780 390 L820 520 L90 520 Z"
                  fill="url(#g)" opacity=".95"/>
            <!-- crates -->
            <g filter="url(#shadow)">
              <rect x="420" y="240" width="110" height="60" rx="10" fill="#d47a2a"/>
              <rect x="420" y="305" width="110" height="60" rx="10" fill="#c96f24"/>
              <rect x="420" y="370" width="110" height="60" rx="10" fill="#b9651f"/>
              <path d="M430 270h90M430 335h90M430 400h90" stroke="#8b4a12" stroke-width="6" opacity=".5"/>
            </g>

            <!-- people (simple) -->
            <g filter="url(#shadow)">
              <!-- left farmer -->
              <circle cx="250" cy="210" r="28" fill="#ffd3b6"/>
              <rect x="220" y="240" width="60" height="120" rx="18" fill="#ff7a2f"/>
              <rect x="230" y="360" width="18" height="80" rx="9" fill="#2d2d2d"/>
              <rect x="255" y="360" width="18" height="80" rx="9" fill="#2d2d2d"/>
              <rect x="210" y="270" width="100" height="18" rx="9" fill="#ff7a2f"/>
              <path d="M220 185c25-35 70-35 95 0" fill="#a86a2f"/>
              <!-- tool -->
              <rect x="195" y="260" width="10" height="190" rx="5" fill="#6b3f1d"/>
              <rect x="180" y="440" width="40" height="12" rx="6" fill="#2d2d2d"/>

              <!-- middle person -->
              <circle cx="560" cy="200" r="26" fill="#ffd3b6"/>
              <rect x="535" y="226" width="50" height="140" rx="18" fill="#cfd6dc"/>
              <rect x="540" y="365" width="16" height="80" rx="8" fill="#2d2d2d"/>
              <rect x="565" y="365" width="16" height="80" rx="8" fill="#2d2d2d"/>
              <rect x="520" y="270" width="90" height="18" rx="9" fill="#cfd6dc"/>

              <!-- right person with box -->
              <circle cx="680" cy="205" r="26" fill="#ffd3b6"/>
              <rect x="655" y="230" width="50" height="135" rx="18" fill="#ffd24a"/>
              <rect x="660" y="365" width="16" height="80" rx="8" fill="#2d2d2d"/>
              <rect x="685" y="365" width="16" height="80" rx="8" fill="#2d2d2d"/>
              <rect x="640" y="290" width="90" height="55" rx="12" fill="#d47a2a"/>
              <path d="M650 315h70" stroke="#8b4a12" stroke-width="6" opacity=".5"/>
            </g>

            <!-- clouds -->
            <g opacity=".9">
              <path d="M305 120c0-22 18-40 40-40 14 0 26 7 33 18 4-2 9-3 14-3 18 0 33 15 33 33 0 2 0 4-1 6h-119c0-5 0-10 0-14z" fill="#fff"/>
              <path d="M615 115c0-18 15-33 33-33 11 0 21 5 27 14 3-1 7-2 11-2 15 0 27 12 27 27 0 2 0 4-1 6h-97c0-4 0-8 0-12z" fill="#fff"/>
            </g>
          </svg>
        </div>
        <div class="promo">
          <h2>Farm Feeding & Stock Management System </h2>
          <p>Smart monitoring for feeding and inventory control.</p>
        </div>

        <!-- Decorative blobs on right panel -->
        <span class="rBlob rBlob1"></span>
        <span class="rBlob rBlob2"></span>
      </div>
    </section>
  </main>
