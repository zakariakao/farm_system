<!-- SUCCESS -->
<div class="alert alertSuccess" role="status" aria-live="polite">
  <div class="alertIcon" aria-hidden="true">✓</div>
  <div class="alertBody">
    <div class="alertTitle">Success</div>
    <div class="alertText">Your changes were saved successfully.</div>
  </div>
  <button class="alertClose" type="button" aria-label="Close">×</button>
</div>

<!-- ERROR -->
<div class="alert alertError" role="alert">
  <div class="alertIcon" aria-hidden="true">!</div>
  <div class="alertBody">
    <div class="alertTitle">Error</div>
    <div class="alertText">Email already exists. Please use another email.</div>
  </div>
  <button class="alertClose" type="button" aria-label="Close">×</button>
</div>

<!-- WARNING -->
<div class="alert alertWarn" role="status" aria-live="polite">
  <div class="alertIcon" aria-hidden="true">⚠</div>
  <div class="alertBody">
    <div class="alertTitle">Warning</div>
    <div class="alertText">Quantity is close to the alert threshold.</div>
  </div>
  <button class="alertClose" type="button" aria-label="Close">×</button>
</div>

<!-- INFO -->
<div class="alert alertInfo" role="status" aria-live="polite">
  <div class="alertIcon" aria-hidden="true">i</div>
  <div class="alertBody">
    <div class="alertTitle">Info</div>
    <div class="alertText">You can filter results using the search bar.</div>
  </div>
  <button class="alertClose" type="button" aria-label="Close">×</button>
</div>
