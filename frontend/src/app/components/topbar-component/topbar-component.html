<div class="topbar">
  <button class="menuBtn" type="button" aria-label="Open menu">
    <span aria-hidden="true">☰</span>
  </button>

  <div class="search">
    <span aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M21 21l-4.3-4.3" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
        <path d="M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z" stroke="#6b7280" stroke-width="2"/>
      </svg>
    </span>
    <input placeholder="Search task" />
    <span class="kbd">Search</span>
  </div>

  <div class="topIcons">
    <button class="iconBtn" title="Mail" type="button" aria-label="Mail">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M4 6h16v12H4V6Z" stroke="#374151" stroke-width="2"/>
        <path d="m4 7 8 6 8-6" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <button class="iconBtn" title="Notifications" type="button" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7Z" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
        <path d="M10 19a2 2 0 0 0 4 0" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="userBox">
      <div class="avatar" aria-hidden="true">{{currentUser?.username?.charAt(0)?.toUpperCase()}}</div>
      <div class="userMeta">
        <b>{{currentUser?.username}}</b>
        <div>{{currentUser?.role}}</div>
      </div>
    </div>
  </div>
</div>
